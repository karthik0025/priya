
<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta property="og:title" content="For Priya 💕">
<meta property="og:description" content="A magical surprise just for you.">
<meta property="og:image" content="thumbnail.png">
<meta property="og:type" content="website">

<title>For Priya 💕</title>

<style>
body {
  margin: 0;
  font-family: "Comic Sans MS", cursive, sans-serif;
  background: linear-gradient(to bottom right, #ffd6e8, #ffeaf4);
  overflow: hidden;
}

/* Floating hearts and butterflies */
.heart, .butterfly {
  position: fixed;
  animation: floatUp 7s linear forwards;
  pointer-events: none;
  z-index: 0;
}
@keyframes floatUp {
  0% { transform: translateY(100vh) scale(1); opacity: 1; }
  100% { transform: translateY(-10vh) scale(0.5); opacity: 0; }
}

/* Title */
h1.title {
  text-align: center;
  margin-top: 30px;
  font-size: 32px;
  color: #ff4d88;
  font-family: 'Comic Sans MS', cursive;
}

/* Card */
.container {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: white;
  padding: 30px;
  border-radius: 25px;
  box-shadow: 0 10px 30px rgba(255,105,180,0.3);
  text-align: center;
  width: 90%;
  max-width: 420px;
  transition: opacity 1s ease;
  z-index: 1;
}

h2 { color: #ff4d88; }

button {
  padding: 10px 20px;
  font-size: 18px;
  border: none;
  border-radius: 20px;
  margin: 10px;
  cursor: pointer;
}

.yes { background: #ff80ab; color: white; }
.no  { background: #cfd8dc; position:absolute; }

/* Popup */
.popup {
  margin-top: 15px;
  font-size: 22px;
  color: #ff1493;
  font-weight: bold;
  animation: fadeIn 0.5s ease;
}
@keyframes fadeIn {
  from { opacity: 0; transform: scale(0.8); }
  to { opacity: 1; transform: scale(1); }
}

/* Love Letter, Final Screen, Celebration */
.love-letter, .final-screen, .celebration {
  position: fixed;
  inset: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  text-align: center;
  padding: 40px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 1.5s ease;
  z-index: 1;
}

.love-letter.show,
.final-screen.show,
.celebration.show {
  opacity: 1;
  pointer-events: all;
}

.love-letter {
  background: linear-gradient(to bottom right, #fff0f5, #ffe6f0);
}

.letter-content {
  max-width: 700px;
  font-size: 22px;
  line-height: 1.8;
  color: #d63384;
}

.countdown {
  margin-top: 30px;
  font-size: 28px;
  color: #ff4d88;
  font-weight: bold;
}

.final-screen {
  background: linear-gradient(to bottom right, #fff0f5, #ffe6f0);
}

.final-question {
  margin-top: 30px;
  font-size: 26px;
  font-weight: bold;
  animation: glow 2s ease-in-out infinite alternate;
}
@keyframes glow {
  from { text-shadow: 0 0 8px #ffb6c1; }
  to   { text-shadow: 0 0 30px #ff1493; }
}

.celebration {
  background: linear-gradient(to bottom right, #ff80ab, #ff4081);
  color: white;
  font-size: 26px;
  line-height: 1.8;
}
</style>
</head>

<body>

<h1 class="title">For Priya 💕</h1>

<div class="container" id="card">
  <h2 id="question">Will you be my Valentine? 💖</h2>
  <button class="yes" onclick="yesClick()">Yes 🥰</button>
  <button class="no" id="noBtn">No 🙈</button>
</div>

<div class="love-letter" id="letterScreen">
  <div class="letter-content" id="letterText"></div>
  <div class="countdown" id="countdown"></div>
</div>

<div class="final-screen" id="finalScreen">
  <div class="final-question">
    Will you build a lifetime with me, Priya? 🥺💍
  </div>
  <br>
  <button class="yes" onclick="celebrate()">Yes… forever 💕</button>
</div>

<div class="celebration" id="celebrationScreen">
  <div>
    🎉💖🎉<br><br>
    You just made me the happiest man alive, Priya. 💖<br><br>
    I promise to choose you every single day. 💍✨
                I love you ❤️ 
  </div>
</div>

<script>
let step = 1;
let noBtn = document.getElementById("noBtn");
let card = document.getElementById("card");
let letterScreen = document.getElementById("letterScreen");
let letterText = document.getElementById("letterText");
let countdown = document.getElementById("countdown");
let finalScreen = document.getElementById("finalScreen");
let celebration = document.getElementById("celebrationScreen");

/* Floating hearts and butterflies */
setInterval(() => {
  let heart = document.createElement("div");
  heart.className = "heart";
  heart.innerHTML = "💖";
  heart.style.left = Math.random() * 100 + "vw";
  heart.style.fontSize = Math.random() * 20 + 20 + "px";
  document.body.appendChild(heart);
  setTimeout(() => heart.remove(), 7000);
}, 800);

setInterval(() => {
  let butterfly = document.createElement("div");
  butterfly.className = "butterfly";
  butterfly.innerHTML = "🦋";
  butterfly.style.left = Math.random() * 100 + "vw";
  butterfly.style.fontSize = Math.random() * 20 + 20 + "px";
  document.body.appendChild(butterfly);
  setTimeout(() => butterfly.remove(), 7000);
}, 1200);

/* Move No button */
function moveButton() {
  let maxX = card.clientWidth - noBtn.offsetWidth;
  let maxY = card.clientHeight - noBtn.offsetHeight;
  noBtn.style.left = Math.random() * maxX + "px";
  noBtn.style.top = Math.random() * maxY + "px";
}
noBtn.addEventListener("mouseenter", moveButton);
noBtn.addEventListener("touchstart", moveButton);

function yesClick() {
  if(step === 1){
    showPopup("🥰 Awwww!");
    document.getElementById("question").innerHTML="Will you marry me? 💍✨";
    step = 2;
  } else {
    showPopup("😍 You’re the sweetest!");
    showLetter();
  }
}

function showPopup(text) {
  const popup = document.createElement("div");
  popup.classList.add("popup");
  popup.textContent = text;
  card.appendChild(popup);
  setTimeout(() => popup.remove(), 2000);
}

function showLetter(){
  card.style.opacity="0";
  setTimeout(()=>{
    card.style.display="none";
    letterScreen.classList.add("show");
    startTyping();
  },1000);
}

function startTyping(){
  const message = `
Priya… 💕

From the day you walked into my life,
you changed everything in the most beautiful way.

You are not just my love…
you are my calm in chaos,
my smile on hard days,
my favorite notification,
my forever person. 🥺💖

I don’t just want today with you…
I want every tomorrow.
`;
  let i=0;
  function typing(){
    if(i<message.length){
      letterText.innerHTML += message[i]==="\n"?"<br>":message[i];
      i++;
      setTimeout(typing,40);
    } else {
      startCountdown();
    }
  }
  typing();
}

function startCountdown(){
  let time=5;
  countdown.innerHTML="Waiting... "+time;
  let timer=setInterval(()=>{
    time--;
    countdown.innerHTML="Waiting... "+time;
    if(time===0){
      clearInterval(timer);
      countdown.innerHTML="";
      showFinalQuestion();
    }
  },1000);
}

function showFinalQuestion(){
  letterScreen.classList.remove("show");
  setTimeout(()=>{
    finalScreen.classList.add("show");
  },1000);
}

function celebrate(){
  finalScreen.classList.remove("show");
  celebration.classList.add("show");
}
</script>

</body>
</html>
